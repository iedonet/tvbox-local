<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iedo 资源站</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem 3rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
      max-width: 420px;
    }
    h1 { margin: 0 0 0.8rem; font-size: 1.6rem; }
    p { color: #94a3b8; line-height: 1.6; margin: 0 0 1.5rem; }
    a {
      display: inline-block;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      padding: 0.7rem 1.4rem;
      border-radius: 10px;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>iedo 的资源站</h1>
    <p>静态页面已通过 Cloudflare Workers Static Assets 成功部署。</p>
    <a href="https://github.com/iedonet/tvbox-local" target="_blank" rel="noopener">查看 GitHub 仓库</a>
  </div>
</body>
</html>
